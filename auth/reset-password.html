<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/unn-tori-logo.png">
    <meta name="description" content="Check an email address in the UNN Tori admin workspace.">
    <title>Reset Password | UNN Tori</title>
    <link rel="stylesheet" href="css/auth-shared.css">
    <link rel="stylesheet" href="css/reset-password.css">
    <script src="js/reset-password.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="brand-panel" aria-label="UNN Tori">
            <div class="brand-lockup">
                <img class="brand-logo" src="../assets/images/unn-tori-logo.png" alt="UNN Tori logo">
                <span class="brand-name">UNN Tori</span>
            </div>

            <div class="brand-story">
                <span class="brand-rule" aria-hidden="true"></span>
                <p class="brand-kicker">THE ADMIN WORKSPACE</p>
                <p class="brand-statement">Every great story starts somewhere.</p>
                <p>Welcome to the place where your ideas become stories worth sharing.</p>
            </div>

            <p class="brand-footer">Create thoughtfully. Publish confidently.</p>
        </section>

        <section class="auth-panel" aria-labelledby="reset-heading">
            <div class="auth-card">
                <div class="icon-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m4 7 8 6 8-6"></path>
                    </svg>
                </div>
                <p class="eyebrow">ACCOUNT RECOVERY</p>
                <h1 id="reset-heading">Forgot Password<span class="heading-period">?</span></h1>
                <p class="intro">Enter your email address.</p>

                <form id="reset-form" novalidate>
                    <div class="form-field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error">
                        <p class="field-error" id="email-error" aria-live="polite"></p>
                    </div>

                    <button class="submit-button" type="submit">Check Email <span aria-hidden="true">&rarr;</span></button>
                    <p class="form-status" id="form-status" role="status" hidden></p>
                </form>

                <p class="auth-prompt"><a href="login.html"><span aria-hidden="true">&larr;</span> Back to Login</a></p>
            </div>
            <p class="page-footer">UNN Tori &middot; Admin access</p>
        </section>
    </main>
</body>
</html>
